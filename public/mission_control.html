<!-- place where pre-checks happen -->

<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>mission control</title>
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body>
        <script src="../components/elements/topbar.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                Topbar.init('mission_control');
            });
        </script>

        <div class="page-content mc-page-content">
            <header class="hero-card">
                <div class="hero-card-text">
                    <h1>🚀 Mission Control</h1>
                    <p class="hero-card-desc">Pre-flight compatibility checks for your project environment — run them before launch to catch missing tools early.</p>
                </div>
                <img src="images/launch.png" alt="Mission control" class="hero-card-img">
            </header>
            <div id="main-box" class="flex-box">
                <!-- Cards rendered dynamically by mission_control.js -->
            </div>
        </div>
        <script src="../components/pages/mission_control.js"></script>
        <script src="../components/styling/theme.js"></script>
    </body>
</html>
