<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>mama</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <script src="../components/elements/topbar.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        Topbar.init('index');
      });
    </script>

    <div class="page-content">
      <header class="hero-card">
        <div class="hero-card-text">
          <h1>Welcome to mama</h1>
          <p class="hero-card-desc">Your AI training and management platform.</p>
        </div>
      </header>
      
      <div class="home-layout">
        <div class="home-left">
          <div class="home-box">
            <h3>status</h3>
            <!-- terminal output / model learning visualization -->
            <div id="status-content"></div>
          </div>
        </div>
        <div class="home-right">
          <div class="home-box">
            <h3>resources</h3>
            <!-- if enabled in settings.json, show top tasks/resource consumption -->
            <div id="resources-content"></div>
          </div>
          <div class="home-box">
            <h3>quick actions</h3>
            <div id="quick-actions-content">
              <button class="qa-pause-play">⏸️ pause/play</button>
              <button class="qa-cancel">✖️ cancel</button>
              <button class="qa-open-folder">📂 open folder</button>
            </div>
          </div>
        </div>
      </div>

      <div class="home-layout">
        <div class="home-right">
          <div class="home-box">
            <h3>site</h3>
            <!-- if site enabled in settings show content from site provider using browserwindow -->
            <!-- otherwise say disabled in settings -->
            <div id="site-content"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- <script src="../renderer.js"></script>
    <script src="../components/pyrunner.js"></script> -->
    <script src="../components/elements/splash.js"></script>
    <script src="../components/elements/resources.js"></script>
    <script src="../components/pages/home.js"></script>
    <script src="../components/styling/theme.js"></script>

  </body>
</html>
