name: Build/release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller certifi

      - name: Write version from tag
        run: |
          python -c "import json; json.dump({'version': '${{ github.ref_name }}'.lstrip('v')}, open('components/version.json', 'w'), indent=4)"

      - name: Build with PyInstaller
        run: pyinstaller main.spec

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          pip install dmgbuild
          mkdir -p release
          dmgbuild -s dmgbuild.py mama release/mama-macos.dmg

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/mama -DestinationPath release/mama-windows.zip

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p release/AppDir
          cp -r dist/mama/. release/AppDir/
          pip install pillow
          python -c "from PIL import Image; im = Image.open('public/images/icon.png'); im.thumbnail((512, 512)); im.save('release/AppDir/mama.png')"
          cat > release/AppDir/mama.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=mama
          Exec=mama
          Icon=mama
          Comment=the mama application: a GUI app for training ai
          Categories=Utility;
          Terminal=false
          DESKTOP
          cat > release/AppDir/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/mama" "$@"
          RUN
          chmod +x release/AppDir/AppRun
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run release/AppDir release/mama-linux.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}