<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>mama - Multimodel Designer</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <script src="../components/elements/topbar.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        Topbar.init('multicon');
      });
    </script>

    <div id="whiteboard-app">
      <!-- Left Toolbar -->
      <div id="wb-toolbar">
        <button class="wb-tool-btn active" data-tool="select" title="Select (V)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 2l16 10-7 2-3 8z" fill="currentColor"/></svg>
        </button>
        <button class="wb-tool-btn" data-tool="pen" title="Pen (P)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
        </button>
        <button class="wb-tool-btn" data-tool="line" title="Line (L)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20L20 4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="wb-tool-btn" data-tool="rect" title="Rectangle (R)">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="wb-tool-btn" data-tool="circle" title="Circle (C)">
          <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <button class="wb-tool-btn" data-tool="text" title="Text (T)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h14v3H5zm4 13h6v3H9zm2-10v13h2V7z" fill="currentColor"/></svg>
        </button>
        <button class="wb-tool-btn" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15.14 3L3 15.14 8.86 21 21 8.86 15.14 3zM9.66 19.29l-4.95-4.95 2.12-2.12 4.95 4.95-2.12 2.12z" fill="currentColor"/></svg>
        </button>
        <div class="wb-tool-separator"></div>
        <button class="wb-tool-btn" id="wb-undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" fill="currentColor"/></svg>
        </button>
        <button class="wb-tool-btn" id="wb-redo" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M11.5 8c-3.54 0-6.55 2.31-7.6 5.5l2.37.78c1.05-3.19 4.06-5.5 7.6-5.5 1.96 0 3.73.72 5.12 1.88L15 14h9V5l-3.6 3.6C16.55 8.99 14.15 8 11.5 8z" fill="currentColor"/></svg>
        </button>
        <div class="wb-tool-separator"></div>
        <button class="wb-tool-btn" id="wb-clear" title="Clear Canvas">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
        </button>
      </div>

      <!-- Top Properties Bar -->
      <div id="wb-props">
        <div class="wb-prop-group">
          <label>Color</label>
          <input type="color" id="wb-color" value="#1a1a2e">
        </div>
        <div class="wb-prop-group">
          <label>Size</label>
          <input type="range" id="wb-size" min="1" max="50" value="3">
          <span id="wb-size-label">3</span>
        </div>
        <div class="wb-prop-group">
          <label>Opacity</label>
          <input type="range" id="wb-opacity" min="0.1" max="1" step="0.1" value="1">
          <span id="wb-opacity-label">1.0</span>
        </div>
        <div class="wb-prop-group" id="wb-font-group" style="display:none;">
          <label>Font Size</label>
          <input type="range" id="wb-font-size" min="12" max="72" value="24">
          <span id="wb-font-size-label">24</span>
        </div>
      </div>

      <!-- Zoom Controls -->
      <div id="wb-zoom-controls">
        <button id="wb-zoom-in" title="Zoom In (+)">+</button>
        <span id="wb-zoom-level">100%</span>
        <button id="wb-zoom-out" title="Zoom Out (-)">−</button>
        <button id="wb-zoom-fit" title="Fit to View">⊡</button>
      </div>

      <!-- Canvas Container -->
      <div id="wb-canvas-container">
        <canvas id="wb-canvas"></canvas>
      </div>

      <!-- Status Bar -->
      <div id="wb-status">
        <span id="wb-coords">X: 0  Y: 0</span>
        <span id="wb-zoom-status">Zoom: 100%</span>
        <span id="wb-object-count">Objects: 0</span>
      </div>
    </div>

    <script src="../components/pages/whiteboard.js"></script>
  </body>
</html>
