<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>mama - Database Explorer</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <script src="../components/elements/topbar.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        Topbar.init('db_explorer');
      });
    </script>

    <div class="page-content" style="display: flex; flex-direction: column; height: calc(100vh - 60px);">
      <div id="db-explorer-content" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
        <p class="loading-text">Loading database explorer...</p>
      </div>
    </div>
    <script src="../components/pages/db_explorer.js"></script>
    <script src="../components/styling/theme.js"></script>
  </body>
</html>
