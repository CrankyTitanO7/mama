<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Frank</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <div class="topbar">
            <span class="topbar-brand" style="cursor:pointer" onclick="window.electron.navigateTo('public/index.html')">Frank</span>
            <div class="topbar-nav">
                <button
                    class="topbar-btn"
                    onclick="window.electron.navigateTo('public/setup.html')"
                >
                    🔧 Setup
                </button>
                <button
                    class="topbar-btn"
                    onclick="window.electron.navigateTo('public/settings.html')"
                >
                    ⚙️ Settings
                </button>
                <button
                    class="topbar-btn"
                    onclick="window.electron.navigateTo('public/mission_control.html')"
                >
                    mission control
                </button>
                <button
                    class="topbar-btn"
                    onclick="window.electron.navigateTo('public/multicon.html')"
                >
                    multimodel designer
                </button>
                <button
                    class="topbar-btn"
                    onclick="window.electron.navigateTo('public/export.html')"
                >
                    export model
                </button>
            </div>
        </div>

    <div class="page-content">
      <h1>Welcome to Frank</h1>
      <p>Your AI training and management platform.</p>
      
      <div class="home-layout">
        <div class="home-left">
          <div class="home-box">
            <h3>status</h3>
            <!-- terminal output / model learning visualization -->
          </div>
        </div>
        <div class="home-right">
          <div class="home-box">
            <h3>resources</h3>
            <!-- if enabled in settings.json, show top tasks/resource consumption -->
          </div>
          <div class="home-box">
            <h3>quick actions</h3>
            <button>pause/play</button>
            <button>cancel</button>
            <button>open folder</button>
          </div>
        </div>
      </div>

      <div class="home-layout">
        <div class="home-left">
          <div class="home-box">
            <h3>reels</h3>
            <!-- if reels enabled in settings show reels from reels provider using browserwindow -->
             <!-- otherwise say disabled in settings -->
          </div>
        </div>
        <div class="home-right">
          <div class="home-box">
            <h3>site</h3>
            <!-- if video enabled in settings show video from video provider using browserwindow -->
              <!-- otherwise say disabled in settings -->
          </div>
        </div>
      </div>

    </div>

    <!-- <script src="../renderer.js"></script>
    <script src="../components/pyrunner.js"></script> -->

  </body>
</html>
