<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>mama - Settings</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <script src="../components/elements/topbar.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        Topbar.init('settings');
      });
    </script>

    <div class="page-content">
      <div id="settings-app">
        <header class="hero-card">
          <div class="hero-card-text">
            <h1>⚙️ Settings</h1>
          </div>
          <nav class="hero-card-actions">
            <button type="button" class="nav-btn" data-settings-nav="public/index.html">🏠 Home</button>
          </nav>
        </header>
        <div id="settings-status" class="settings-status" style="display:none"></div>
        <div id="settings-content">
          <p class="loading-text">Loading settings...</p>
        </div>
      </div>
    </div>
    <script src="../components/styling/theme.js"></script>
    <script src="../components/setup/settings.js"></script>
  </body>
</html>
